<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>403 Forbidden</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #101214;
      color: #f4f5f6;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    main { width: min(560px, 100%); border-left: 4px solid #d64b43; padding: 8px 0 10px 28px; }
    h1 { margin: 0; font-size: clamp(72px, 20vw, 132px); line-height: .88; letter-spacing: 0; }
    p { margin: 24px 0 0; color: #aeb4ba; font-size: 18px; line-height: 1.6; }
    strong { color: #f4f5f6; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>403</h1>
    <p><strong>Forbidden</strong><br>This site is temporarily unavailable.</p>
  </main>
</body>
</html>
